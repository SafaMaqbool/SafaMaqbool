<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" fill="none">
<style>
.sans{font-family:'Geist','Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .serif{font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;font-style:italic} .mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.a1{animation:d1 14s ease-in-out infinite alternate}.a2{animation:d2 17s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(160px,-60px)}}@keyframes d2{to{transform:translate(-150px,60px)}}
.sh{animation:sh 3.5s ease-in-out infinite}@keyframes sh{0%{transform:translateX(-70px)}60%,100%{transform:translateX(280px)}}
.arr{animation:n 1.8s ease-in-out infinite}@keyframes n{50%{transform:translateX(4px)}}
.trace{animation:tr 7s linear infinite}@keyframes tr{to{stroke-dashoffset:-100}}
.pt{opacity:0;animation:rise 7s linear infinite}@keyframes rise{0%{opacity:0;transform:translateY(0)}15%{opacity:.8}100%{opacity:0;transform:translateY(-190px)}}
.glow{transform-box:fill-box;transform-origin:center;animation:gl 2.4s ease-out infinite}@keyframes gl{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(1.18,1.5)}}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#10b981"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
</linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<linearGradient id="gs" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#10b981"/><stop offset=".35" stop-color="#22d3ee"/><stop offset=".5" stop-color="#f0fdfa"/><stop offset=".65" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="rgba(236,242,239,0.035)"/></pattern><clipPath id="c"><rect width="840" height="250" rx="22"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="840" height="250" fill="#060807"/>
<g filter="url(#blur)"><circle class="a1" cx="120" cy="250" r="140" fill="#10b981" opacity=".3"/><circle class="a2" cx="780" cy="0" r="130" fill="#a78bfa" opacity=".25"/></g>
<rect width="840" height="250" fill="url(#grid)"/></g>
<rect x=".5" y=".5" width="839" height="249" rx="21.5" stroke="rgba(236,242,239,0.09)"/>
<rect class="trace" x=".75" y=".75" width="838.5" height="248.5" rx="21.5" pathLength="100" stroke="url(#g)" stroke-width="1.5" stroke-dasharray="18 82" stroke-linecap="round"/>
<circle class="pt" cx="493" cy="235" r="2" fill="#ffffff" style="animation-delay:-3.05s;animation-duration:7.35s"/><circle class="pt" cx="219" cy="232" r="2" fill="#22d3ee" style="animation-delay:-0.56s;animation-duration:6.21s"/><circle class="pt" cx="122" cy="234" r="1" fill="#ffffff" style="animation-delay:-5.79s;animation-duration:7.62s"/><circle class="pt" cx="660" cy="241" r="1.3" fill="#10b981" style="animation-delay:-4.99s;animation-duration:5.25s"/><circle class="pt" cx="66" cy="212" r="1.3" fill="#10b981" style="animation-delay:-4.67s;animation-duration:6.31s"/><circle class="pt" cx="635" cy="212" r="1.3" fill="#a78bfa" style="animation-delay:-3.00s;animation-duration:7.65s"/><circle class="pt" cx="498" cy="241" r="1.6" fill="#ffffff" style="animation-delay:-5.99s;animation-duration:8.98s"/><circle class="pt" cx="115" cy="245" r="1.6" fill="#a78bfa" style="animation-delay:-4.55s;animation-duration:7.05s"/><circle class="pt" cx="60" cy="204" r="1" fill="#ffffff" style="animation-delay:-0.65s;animation-duration:6.16s"/><circle class="pt" cx="98" cy="201" r="1" fill="#22d3ee" style="animation-delay:-1.26s;animation-duration:8.64s"/><circle class="pt" cx="511" cy="224" r="2" fill="#ffffff" style="animation-delay:-0.44s;animation-duration:7.52s"/><circle class="pt" cx="721" cy="217" r="1.6" fill="#10b981" style="animation-delay:-1.87s;animation-duration:5.06s"/><circle class="pt" cx="449" cy="207" r="1.3" fill="#22d3ee" style="animation-delay:-4.24s;animation-duration:5.04s"/><circle class="pt" cx="506" cy="231" r="1.3" fill="#22d3ee" style="animation-delay:-2.68s;animation-duration:5.76s"/><circle class="pt" cx="779" cy="208" r="2" fill="#ffffff" style="animation-delay:-0.70s;animation-duration:6.68s"/><circle class="pt" cx="247" cy="200" r="1.6" fill="#a78bfa" style="animation-delay:-5.99s;animation-duration:5.08s"/><circle class="pt" cx="221" cy="225" r="1" fill="#10b981" style="animation-delay:-5.94s;animation-duration:5.85s"/><circle class="pt" cx="294" cy="200" r="1.6" fill="#a78bfa" style="animation-delay:-2.32s;animation-duration:5.30s"/><circle class="pt" cx="243" cy="237" r="1.3" fill="#10b981" style="animation-delay:-3.61s;animation-duration:6.49s"/><circle class="pt" cx="494" cy="208" r="2" fill="#22d3ee" style="animation-delay:-5.20s;animation-duration:5.73s"/><circle class="pt" cx="187" cy="219" r="1.3" fill="#22d3ee" style="animation-delay:-4.35s;animation-duration:5.63s"/><circle class="pt" cx="674" cy="235" r="1.3" fill="#ffffff" style="animation-delay:-5.29s;animation-duration:7.41s"/><circle class="pt" cx="461" cy="203" r="1" fill="#10b981" style="animation-delay:-0.23s;animation-duration:8.85s"/><circle class="pt" cx="274" cy="245" r="2" fill="#a78bfa" style="animation-delay:-2.52s;animation-duration:8.62s"/><circle class="pt" cx="532" cy="218" r="1.3" fill="#10b981" style="animation-delay:-0.76s;animation-duration:6.92s"/><circle class="pt" cx="699" cy="239" r="1" fill="#a78bfa" style="animation-delay:-1.27s;animation-duration:8.66s"/>
<text class="mono" x="420" y="64" text-anchor="middle" font-size="12" fill="#8b9792" letter-spacing="2.6">HAVE A PRODUCT IN MIND?</text>
<clipPath id="cr"><rect x="140" y="70" width="0" height="70"><animate attributeName="width" values="0;0;560;560" keyTimes="0;.06;.3;1" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .7 .2 1;0 0 1 1"/></rect></clipPath>
<text clip-path="url(#cr)" class="sans" x="420" y="120" text-anchor="middle" font-size="44" font-weight="600" fill="#ecf2ef" letter-spacing="-1.4">Let's build something <tspan class="serif" font-weight="400" font-size="50" fill="url(#gs)">real.</tspan></text>
<rect x="0" y="0" width="0" height="0"/>
<clipPath id="bc"><rect x="290" y="152" width="260" height="48" rx="24"/></clipPath>
<rect class="glow" x="290" y="152" width="260" height="48" rx="24" fill="none" stroke="#10b981" stroke-width="2"/>
<rect x="290" y="152" width="260" height="48" rx="24" fill="#ecf2ef"/>
<g clip-path="url(#bc)"><rect class="sh" x="290" y="152" width="60" height="48" fill="url(#shine)"/></g>
<g transform="translate(290 152)">
  
  <text class="sans" x="118" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#060807">Book a free 30-min call</text>
  <g class="arr"><path d="M226 24 H240 M234 18 L240 24 L234 30" stroke="#060807" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
<text class="mono" x="420" y="228" text-anchor="middle" font-size="12" fill="#8b9792">s.maq.basha@gmail.com</text>
<linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#10b981" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</svg>
