<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" fill="none">
<style>
.sans{font-family:'Geist','Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .serif{font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;font-style:italic} .mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.q{opacity:0;animation:q 21s ease-in-out infinite}
@keyframes q{0%{opacity:0;transform:translateY(8px)}3%{opacity:1;transform:none}30%{opacity:1}33.3%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
.bar{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:bar 21s linear infinite}
@keyframes bar{0%{transform:scaleX(0)}33.3%{transform:scaleX(1)}33.4%,100%{transform:scaleX(0)}}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#10b981"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
</linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="rgba(236,242,239,0.035)"/></pattern></defs>
<rect x=".5" y=".5" width="839" height="219" rx="18" fill="#0c100f" stroke="rgba(236,242,239,0.09)"/>
<text class="serif" x="34" y="100" font-size="88" fill="url(#g)">“</text>
<g class="q" style="animation-delay:0s"><text class="serif" x="100" y="70" font-size="23" fill="#ecf2ef">Safa is a fantastic developer to work with. She is patient in</text><text class="serif" x="100" y="100" font-size="23" fill="#ecf2ef">understanding requirements, excellent in navigating ambiguity, and</text><text class="serif" x="100" y="130" font-size="23" fill="#ecf2ef">a strong web designer.</text><text class="mono" x="102" y="174" font-size="11" fill="#8b9792" letter-spacing="1.4">JESSE D. — OEE INTELLISUITE · UPWORK</text></g><g class="q" style="animation-delay:7s"><text class="serif" x="100" y="70" font-size="23" fill="#ecf2ef">Excellent job. Safa went way beyond my expectations and delivered</text><text class="serif" x="100" y="100" font-size="23" fill="#ecf2ef">incredible value. I&#x27;m delighted with the results.</text><text class="mono" x="102" y="144" font-size="11" fill="#8b9792" letter-spacing="1.4">UPWORK CLIENT — REACT &amp; NEXT.JS BUILD</text></g><g class="q" style="animation-delay:14s"><text class="serif" x="100" y="70" font-size="23" fill="#ecf2ef">Safa is committed to deliver the project within expectations. A</text><text class="serif" x="100" y="100" font-size="23" fill="#ecf2ef">Figma design had to become frontend code. The result is really</text><text class="serif" x="100" y="130" font-size="23" fill="#ecf2ef">good!</text><text class="mono" x="102" y="174" font-size="11" fill="#8b9792" letter-spacing="1.4">TOMISLAV P. — ASTRO FROM FIGMA · UPWORK</text></g><rect x="360" y="196" width="36" height="3" rx="1.5" fill="rgba(236,242,239,.12)"/><rect class="bar" style="animation-delay:0s" x="360" y="196" width="36" height="3" rx="1.5" fill="#10b981"/><rect x="404" y="196" width="36" height="3" rx="1.5" fill="rgba(236,242,239,.12)"/><rect class="bar" style="animation-delay:7s" x="404" y="196" width="36" height="3" rx="1.5" fill="#10b981"/><rect x="448" y="196" width="36" height="3" rx="1.5" fill="rgba(236,242,239,.12)"/><rect class="bar" style="animation-delay:14s" x="448" y="196" width="36" height="3" rx="1.5" fill="#10b981"/>
</svg>
