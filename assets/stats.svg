<svg xmlns="http://www.w3.org/2000/svg" width="840" height="128" viewBox="0 0 840 128" fill="none">
<style>
.sans{font-family:'Geist','Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .serif{font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;font-style:italic} .mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
.s{animation:up .8s cubic-bezier(.2,.7,.2,1) both}@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#10b981"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
</linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="rgba(236,242,239,0.035)"/></pattern></defs>
<rect x=".5" y=".5" width="839" height="127" rx="18" fill="#0c100f" stroke="rgba(236,242,239,0.09)"/>
<g class="s" style="animation-delay:0.10s">
  <text class="sans" x="30.0" y="66" font-size="40" font-weight="600" fill="#ecf2ef" letter-spacing="-1.2">100<tspan fill="url(#g)">%</tspan></text>
  <text class="mono" x="31.0" y="96" font-size="11" fill="#8b9792" letter-spacing="1.2">UPWORK JOB SUCCESS</text>
</g><g class="s" style="animation-delay:0.22s">
  <text class="sans" x="240.0" y="66" font-size="40" font-weight="600" fill="#ecf2ef" letter-spacing="-1.2">5.0<tspan fill="url(#g)">★</tspan></text>
  <text class="mono" x="241.0" y="96" font-size="11" fill="#8b9792" letter-spacing="1.2">AVERAGE CLIENT RATING</text>
</g><line x1="210.0" y1="26" x2="210.0" y2="102" stroke="rgba(236,242,239,0.09)"/><g class="s" style="animation-delay:0.34s">
  <text class="sans" x="450.0" y="66" font-size="40" font-weight="600" fill="#ecf2ef" letter-spacing="-1.2">568<tspan fill="url(#g)">+</tspan></text>
  <text class="mono" x="451.0" y="96" font-size="11" fill="#8b9792" letter-spacing="1.2">LESSONS TAUGHT ON PREPLY</text>
