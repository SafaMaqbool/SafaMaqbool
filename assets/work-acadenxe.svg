<svg xmlns="http://www.w3.org/2000/svg" width="410" height="280" viewBox="0 0 410 280" fill="none">
<style>
.sans{font-family:'Geist','Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .serif{font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;font-style:italic} .mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.b1{animation:m1 12s ease-in-out infinite alternate}.b2{animation:m2 15s ease-in-out infinite alternate}
@keyframes m1{to{transform:translate(-110px,30px)}}@keyframes m2{to{transform:translate(140px,-30px)}}
.ping{animation:ping 2s cubic-bezier(0,0,.2,1) infinite}@keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(3);opacity:0}}
.arr{animation:nudge 2.4s ease-in-out infinite}
.trace{animation:tr 8s linear infinite}@keyframes tr{to{stroke-dashoffset:-100}}@keyframes nudge{0%,60%,100%{transform:none}30%{transform:translate(3px,-3px)}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#10b981"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
</linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<linearGradient id="gs" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#10b981"/><stop offset=".35" stop-color="#22d3ee"/><stop offset=".5" stop-color="#f0fdfa"/><stop offset=".65" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="rgba(236,242,239,0.035)"/></pattern>
<clipPath id="cv"><path d="M16 0H394A16 16 0 0 1 410 16V132H0V16A16 16 0 0 1 16 0Z"/></clipPath>
<linearGradient id="fadeb" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#0c100f" stop-opacity="0"/><stop offset="1" stop-color="#0c100f"/></linearGradient></defs>
<rect x=".5" y=".5" width="409" height="279" rx="16" fill="#0c100f" stroke="rgba(236,242,239,0.09)"/>
<rect class="trace" style="animation-delay:-1.7s" x=".75" y=".75" width="408.5" height="278.5" rx="16" pathLength="100" stroke="#a78bfa" stroke-opacity=".9" stroke-width="1.4" stroke-dasharray="10 90" stroke-linecap="round"/>
<g clip-path="url(#cv)">
  <rect width="410" height="132" fill="#080b0a"/>
  <g filter="url(#blur)"><circle class="b1" cx="300" cy="40" r="90" fill="#a78bfa" opacity=".55"/><circle class="b2" cx="120" cy="120" r="80" fill="#f472b6" opacity=".45"/></g>
  <rect width="410" height="132" fill="url(#grid)"/>
  <text class="serif" x="388" y="118" text-anchor="end" font-size="96" fill="rgba(236,242,239,.10)">02</text>
  <rect width="410" height="132" fill="url(#fadeb)"/>
</g>
<text class="mono" x="24" y="36" font-size="11" fill="#ecf2ef" opacity=".75" letter-spacing="1.5">EDTECH PLATFORM · 2026</text>
<rect x="300" y="20" width="86" height="24" rx="12" fill="rgba(6,8,7,.55)" stroke="rgba(236,242,239,0.09)"/>
<circle cx="314" cy="32" r="3.5" fill="#f5b544"/><circle class="ping" cx="314" cy="32" r="3.5" fill="#f5b544" style="transform-origin:314px 32px"/>
<text class="mono" x="324" y="36" font-size="11" fill="#ecf2ef">Building</text>
<text class="sans" x="24" y="166" font-size="23" font-weight="600" fill="#ecf2ef" letter-spacing="-.6">Acadenxe</text>
<g class="arr"><path d="M370 166 L384 152 M374 152 H384 V162" stroke="#ecf2ef" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="sans" x="24" y="196" font-size="13.5" fill="#8b9792">Academic management platform shipped phase by</text><text class="sans" x="24" y="216" font-size="13.5" fill="#8b9792">phase, with a security review at every phase.</text>
<rect x="24" y="236" width="67" height="24" rx="12" fill="rgba(236,242,239,.04)" stroke="rgba(236,242,239,0.09)"/><text class="mono" x="57" y="252" text-anchor="middle" font-size="11" fill="#ecf2ef">Next.js</text><rect x="98.9" y="236" width="87" height="24" rx="12" fill="rgba(236,242,239,.04)" stroke="rgba(236,242,239,0.09)"/><text class="mono" x="142" y="252" text-anchor="middle" font-size="11" fill="#ecf2ef">TypeScript</text><rect x="193.9" y="236" width="74" height="24" rx="12" fill="rgba(236,242,239,.04)" stroke="rgba(236,242,239,0.09)"/><text class="mono" x="231" y="252" text-anchor="middle" font-size="11" fill="#ecf2ef">Security</text>
</svg>
