<svg xmlns="http://www.w3.org/2000/svg" width="410" height="280" viewBox="0 0 410 280" fill="none">
<style>
.sans{font-family:'Geist','Inter','Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif} .serif{font-family:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;font-style:italic} .mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.b1{animation:m1 12s ease-in-out infinite alternate}.b2{animation:m2 15s ease-in-out infinite alternate}
@keyframes m1{to{transform:translate(-110px,30px)}}@keyframes m2{to{transform:translate(140px,-30px)}}
.ping{animation:ping 2s cubic-bezier(0,0,.2,1) infinite}@keyframes ping{from{transform:scale(1);opacity:.7}to{transform:scale(3);opacity:0}}
.arr{animation:nudge 2.4s ease-in-out infinite}@keyframes nudge{0%,60%,100%{transform:none}30%{transform:translate(3px,-3px)}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#10b981"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/>
</linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="rgba(236,242,239,0.035)"/></pattern>
<clipPath id="cv"><path d="M16 0H394A16 16 0 0 1 410 16V132H0V16A16 16 0 0 1 16 0Z"/></clipPath>
<linearGradient id="fadeb" x1="0" y1="0" x2="0" y2="1"><stop offset=".45" stop-color="#0c100f" stop-opacity="0"/><stop offset="1" stop-color="#0c100f"/></linearGradient></defs>
<rect x=".5" y=".5" width="409" height="279" rx="16" fill="#0c100f" stroke="rgba(236,242,239,0.09)"/>
<g clip-path="url(#cv)">
  <rect width="410" height="132" fill="#080b0a"/>
  <g filter="url(#blur)"><circle class="b1" cx="300" cy="40" r="90" fill="#d4af37" opacity=".55"/><circle class="b2" cx="120" cy="120" r="80" fill="#8b6cf6" opacity=".45"/></g>
  <rect width="410" height="132" fill="url(#grid)"/>
  <text class="serif" x="388" y="118" text-anchor="end" font-size="96" fill="rgba(236,242,239,.10)">03</text>
  <rect width="410" height="132" fill="url(#fadeb)"/>
</g>
<text class="mono" x="24" y="36" font-size="11" fill="#ecf2ef" opacity=".75" letter-spacing="1.5">HEADLESS CMS · 2026</text>
<rect x="316" y="20" width="70" height="24" rx="12" fill="rgba(6,8,7,.55)" stroke="rgba(236,242,239,0.09)"/>
<circle cx="330" cy="32" r="3.5" fill="#10b981"/><circle class="ping" cx="330" cy="32" r="3.5" fill="#10b981" style="transform-origin:330px 32px"/>
<text class="mono" x="340" y="36" font-size="11" fill="#ecf2ef">Live</text>
<text class="sans" x="24" y="166" font-size="23" font-weight="600" fill="#ecf2ef" letter-spacing="-.6">SM Lumière</text>
<g class="arr"><path d="M370 166 L384 152 M374 152 H384 V162" stroke="#ecf2ef" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
<text class="sans" x="24" y="196" font-size="13.5" fill="#8b9792">WordPress to a fast, editor-friendly 11-page</text><text class="sans" x="24" y="216" font-size="13.5" fill="#8b9792">headless site for an entrepreneur network.</text>
<rect x="24" y="236" width="67" height="24" rx="12" fill="rgba(236,242,239,.04)" stroke="rgba(236,242,239,0.09)"/><text class="mono" x="57" y="252" text-anchor="middle" font-size="11" fill="#ecf2ef">Next.js</text><rect x="98.9" y="236" width="60" height="24" rx="12" fill="rgba(236,242,239,.04)" stroke="rgba(236,242,239,0.09)"/><text class="mono" x="129" y="252" text-anchor="middle" font-size="11" fill="#ecf2ef">Sanity</text><rect x="167.10000000000002" y="236" width="60" height="24" rx="12" fill="rgba(236,242,239,.04)" stroke="rgba(236,242,239,0.09)"/><text class="mono" x="197" y="252" text-anchor="middle" font-size="11" fill="#ecf2ef">Motion</text>
</svg>
